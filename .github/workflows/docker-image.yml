name: Docker Image CI

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select Environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - production

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t aakashsharma5123/aakash-my-app:${{ github.sha }} .
          docker tag aakashsharma5123/aakash-my-app:${{ github.sha }} aakashsharma5123/aakash-my-app:latest

      - name: Push Docker Image
        run: |
          docker push aakashsharma5123/aakash-my-app:${{ github.sha }}
          docker push aakashsharma5123/aakash-my-app:latest
